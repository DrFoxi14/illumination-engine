name: Blender Scene Validation

on:
  push:
    branches: [main]
    paths:
      - "engine/blender/**"
      - "engine/core/**"
      - "characters/**"
      - "scripts/**"
      - ".github/workflows/blender-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "engine/blender/**"
      - "engine/core/**"
      - "characters/**"
      - "scripts/**"
      - ".github/workflows/blender-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blender-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-inspect:
    name: Generate Prototype 001 in Blender
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BLENDER_VERSION: "4.5.15"
      BLENDER_DIR: ${{ github.workspace }}/.blender-4.5.15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache Blender binary
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: .blender-4.5.15
          key: blender-linux-x64-4.5.15

      - name: Download and verify official Blender LTS
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/blender-4.5.15-linux-x64.tar.xz"
          checksum_file="${RUNNER_TEMP}/blender-4.5.15.sha256"
          base_url="https://download.blender.org/release/Blender4.5"

          curl --fail --location --retry 3 --retry-delay 2 \
            "${base_url}/blender-4.5.15-linux-x64.tar.xz" \
            --output "${archive}"
          curl --fail --location --retry 3 --retry-delay 2 \
            "${base_url}/blender-4.5.15.sha256" \
            --output "${checksum_file}"

          python - "${checksum_file}" "${archive}" <<'PY'
          import hashlib
          import re
          import sys
          from pathlib import Path

          checksum_path = Path(sys.argv[1])
          archive_path = Path(sys.argv[2])
          filename = archive_path.name
          checksum_text = checksum_path.read_text(encoding="utf-8", errors="replace")

          expected = None
          for line in checksum_text.splitlines():
              if filename in line:
                  match = re.search(r"(?i)\b[a-f0-9]{64}\b", line)
                  if match:
                      expected = match.group(0).lower()
                      break

          if expected is None:
              raise SystemExit(f"No SHA-256 checksum found for {filename}")

          digest = hashlib.sha256()
          with archive_path.open("rb") as source:
              for chunk in iter(lambda: source.read(1024 * 1024), b""):
                  digest.update(chunk)

          actual = digest.hexdigest()
          if actual != expected:
              raise SystemExit(
                  f"Blender archive checksum mismatch: expected {expected}, got {actual}"
              )
          print(f"Verified official Blender archive SHA-256: {actual}")
          PY

          mkdir -p "${BLENDER_DIR}"
          tar --extract --xz --file "${archive}" \
            --directory "${BLENDER_DIR}" --strip-components=1
          test -x "${BLENDER_DIR}/blender"

      - name: Verify Blender runtime
        shell: bash
        run: "${BLENDER_DIR}/blender" --background --version

      - name: Generate character and render silhouette review
        shell: bash
        run: |
          "${BLENDER_DIR}/blender" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python scripts/build_character.py \
            -- \
            --output-dir outputs/ci \
            --silhouette-only

      - name: Upload Blender project and review renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-001-blender-validation
          path: outputs/ci/
          if-no-files-found: warn
          retention-days: 7
