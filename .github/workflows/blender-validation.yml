name: Blender Scene Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-and-inspect:
    name: Generate Prototype 001 in Blender
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and verify Blender 4.5.15 LTS
        shell: bash
        run: |
          set -euo pipefail

          version="4.5.15"
          archive_name="blender-${version}-linux-x64.tar.xz"
          archive_path="${RUNNER_TEMP}/${archive_name}"
          checksum_path="${RUNNER_TEMP}/blender-${version}.sha256"
          checksum_line="${RUNNER_TEMP}/blender-${version}-linux.sha256"
          install_dir="${RUNNER_TEMP}/blender-${version}"

          base_url="https://download.blender.org/release/Blender4.5"
          curl --fail --location --retry 3 \
            "${base_url}/${archive_name}" --output "${archive_path}"
          curl --fail --location --retry 3 \
            "${base_url}/blender-${version}.sha256" --output "${checksum_path}"

          grep "${archive_name}" "${checksum_path}" > "${checksum_line}"
          (
            cd "${RUNNER_TEMP}"
            sha256sum --check "${checksum_line}"
          )

          mkdir -p "${install_dir}"
          tar --extract --xz --file "${archive_path}" \
            --directory "${install_dir}" --strip-components=1
          test -x "${install_dir}/blender"
          echo "BLENDER_BIN=${install_dir}/blender" >> "${GITHUB_ENV}"

      - name: Verify Blender runtime
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_BIN}" --background --version

      - name: Build and validate character
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_BIN}" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python scripts/build_character.py \
            -- \
            --output-dir outputs/ci \
            --silhouette-only

      - name: Upload Blender scene and silhouette renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-001-blender-validation
          path: outputs/ci/
          if-no-files-found: warn
          retention-days: 7
